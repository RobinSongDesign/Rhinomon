name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Sprite contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow enables the "committed sheets == generator output" check.
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/ci/check_contract.py

  build:
    name: Build plug-in and Yak package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # The same script the release workflow runs: Release build with warnings
      # as errors, then `yak build`. Nothing is published from here.
      - run: ./packaging/build-yak.ps1 -OutDir dist
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: rhinomon-package
          path: |
            dist/*.yak
            src/Rhinomon/bin/Release/net7.0-windows/Rhinomon.rhp
          if-no-files-found: error
